<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="top-header">
    <div class="logo">
      <img src="img/logo 2.png" alt="Monate Logo">
    </div>
    <nav class="nav-links">
      <a href="index.html">HOME</a>
      <a href="#">ABOUT US</a>
    </nav>
    <div class="account-cart">
      <div class="account">
        <img src="img/profile.png" alt="Account">
        <span>ACCOUNT</span>
      </div>
      <div class="divider"></div>
      <div class="cart">
        <img src="img/shopping cart.png" alt="Cart">
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="food-content">
    <a href="Thohoyandou.html" class="back-btn">⬅</a>

    <div class="food-detail">
      <!-- Food Image -->
      <div class="food-img">
        <img id="foodImg" src="" alt="">
      </div>

      <!-- Food Info -->
      <div class="food-info">
        <h2 id="foodName">HOT FRIED CHICKEN</h2>
        <p id="foodPrice">R30</p>
        <p><strong>Description:</strong></p>

        <!-- Quantity -->
        <div class="quantity">
          <button class="qty-btn">-</button>
          <span id="qty">1</span>
          <button class="qty-btn">+</button>
        </div>

        <!-- Add to Cart -->
        <button class="add-cart">ADD TO CART</button>
      </div>
    </div>
  </main>

  <script>
    // Load food details from localStorage
    const food = JSON.parse(localStorage.getItem("foodItem"));
    if(food){
      document.getElementById("foodImg").src = food.img;
      document.getElementById("foodName").textContent = food.name;
      document.getElementById("foodPrice").textContent = food.price;
    }

    // Quantity buttons
    let qty = 1;
    const qtySpan = document.getElementById("qty");
    document.querySelectorAll(".qty-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if(btn.textContent === "+" && qty < 10) qty++;
        if(btn.textContent === "-" && qty > 1) qty--;
        qtySpan.textContent = qty;
      });
    });
  </script>
</body>
</html>
