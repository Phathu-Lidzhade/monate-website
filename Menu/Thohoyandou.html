<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monate Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="top-header">
    <div class="logo">
      <img src="img/logo 2.png" alt="Monate Logo">
    </div>
    <nav class="nav-links">
      <a href="#">HOME</a>
      <a href="#">ABOUT US</a>
    </nav>
    <div class="account-cart">
      <!-- Account -->
      <a href="account.html" class="account">
        <img src="img/profile.png" alt="Account">
        <span>ACCOUNT</span>
      </a>
      <div class="divider"></div>
      <!-- Cart -->
      <a href="cart.html" class="cart">
        <img src="img/shopping cart.png" alt="Cart">
      </a>
    </div>
  </header>

  <!-- LOCATION BAR -->
  <div class="location-bar">
    <a href="Thohoyandou.html" class="location-item active">
      <img src="img/location.png" alt="Location">
      <span>THOHOYANDOU</span>
    </a>
    <a href="mukula.html" class="location-item">
      <img src="img/location 2.png" alt="Location">
      <span>MUKULA</span>
    </a>
    <a href="lufule.html" class="location-item">
      <img src="img/Location 2.png" alt="Location">
      <span>LUFULE</span>
    </a>
  </div>

  <main class="content">
    <!-- SIDE MENU -->
    <aside class="side-menu">
      <h2>MENU</h2>
      <p class="new-item">New: Limited Time</p>
      <ul>
        <li class="active" data-category="chicken">CHICKEN</li>
        <li data-category="kota">KOTA</li>
        <li data-category="sharing">SHARING</li>
        <li data-category="wings">WINGS</li>
        <li data-category="drinks">DRINKS</li>
      </ul>
    </aside>

    <!-- MAIN MENU ITEMS -->
    <section class="menu-section" id="menu-section">
      <h3>CHICKEN</h3>
      <div class="menu-grid">
        <div class="menu-card" data-name="HOT FRIED CHICKEN" data-price="R30" data-img="img/38b39197551d5de6ffa145c8759d35e9 1.png">
          <img src="img/38b39197551d5de6ffa145c8759d35e9 1.png" alt="Hot Fried Chicken">
          <p class="item-name">HOT FRIED CHICKEN</p>
          <p class="item-price">R30</p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
